name: CI

on:
  pull_request:
    branches:
      - main
      - dev
      - product
  push:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-project:
    name: Test project
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: make install

      - name: Run linter
        run: make lint

      - name: Run Backend Tests
        run: make test-backend

      - name: Run Mock Server Tests
        run: make test-mock

      - name: Run Web UI Tests
        run: make test-ui