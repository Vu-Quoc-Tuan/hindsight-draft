name: CD - Build & Deploy

on:
  push:
    branches:
      - product

concurrency:
  group: cd-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare lowercase image names
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "API_IMAGE=ghcr.io/${OWNER_LC}/hindsight-api:latest" >> $GITHUB_ENV
          echo "WEB_IMAGE=ghcr.io/${OWNER_LC}/hindsight-web:latest" >> $GITHUB_ENV
          echo "MOCK_IMAGE=ghcr.io/${OWNER_LC}/hindsight-mock:latest" >> $GITHUB_ENV

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: nocpro-chain-explain
          file: nocpro-chain-explain/services/api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web Image (Explain UI)
        uses: docker/build-push-action@v5
        with:
          context: nocpro-chain-explain/services/web
          file: nocpro-chain-explain/services/web/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Mock Image (NocPro Mock UI)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: nocpro-mock/Dockerfile
          push: true
          tags: ${{ env.MOCK_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: tuanvdt
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR on server
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Configure production environment secrets
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          if [ -n "$PROD_ENV" ]; then
            echo "$PROD_ENV" > nocpro-chain-explain/.env
            chmod 600 nocpro-chain-explain/.env
            echo "Successfully wrote production .env file."
          else
            echo "No PROD_ENV secret provided; using compose defaults."
          fi

      - name: Pull pre-built images & Restart stack
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          export API_IMAGE="ghcr.io/${OWNER_LC}/hindsight-api:latest"
          export WEB_IMAGE="ghcr.io/${OWNER_LC}/hindsight-web:latest"
          export MOCK_IMAGE="ghcr.io/${OWNER_LC}/hindsight-mock:latest"

          echo "Pulling pre-built images from GHCR..."
          docker compose -f nocpro-chain-explain/docker-compose.yml pull --policy always api migrate web mock-ui

          echo "Starting containers (Explain UI, Mock UI, API, Kafka, Postgres)..."
          docker compose -f nocpro-chain-explain/docker-compose.yml up -d --no-build
          docker compose -f nocpro-chain-explain/docker-compose.yml ps

      - name: Clean up old Docker images to protect 4.5GB disk
        run: |
          echo "Cleaning up old unused images..."
          docker image prune -f
          echo "Remaining disk space on server:"
          df -h /

      - name: Verify Unified Gateway Health & Security Isolation
        run: |
          echo "Checking service health via Unified Gateway (port 3000)..."
          sleep 5
          curl -f http://127.0.0.1:3000/api/v1/health || exit 1
          curl -f http://127.0.0.1:3000/ || exit 1

          echo "Waiting for topology materialization (IP_NETWORK & IT_SERVICES)..."
          PROFILES="[]"
          for i in {1..30}; do
            PROFILES=$(curl -sf http://127.0.0.1:3000/api/v1/topology/profiles || echo "[]")
            if echo "$PROFILES" | grep -q "IP_NETWORK" && echo "$PROFILES" | grep -q "IT_SERVICES"; then
              echo "Both IP_NETWORK and IT_SERVICES profiles are READY: $PROFILES"
              break
            fi
            sleep 2
          done

          echo "$PROFILES" | grep -q "IP_NETWORK" || { echo "ERROR: IP_NETWORK not found in profiles: $PROFILES"; exit 1; }
          echo "$PROFILES" | grep -q "IT_SERVICES" || { echo "ERROR: IT_SERVICES not found in profiles: $PROFILES"; exit 1; }

          echo "Verifying topology search queries..."
          IP_NODES=$(curl -sf "http://127.0.0.1:3000/api/v1/topology/search?profile_id=IP_NETWORK&q=&limit=1" || exit 1)
          echo "IP search sample: $IP_NODES"
          echo "$IP_NODES" | grep -q '"status":"AVAILABLE"' || { echo "ERROR: IP_NETWORK search status not AVAILABLE"; exit 1; }

          IT_NODES=$(curl -sf "http://127.0.0.1:3000/api/v1/topology/search?profile_id=IT_SERVICES&q=&limit=1" || exit 1)
          echo "IT search sample: $IT_NODES"
          echo "$IT_NODES" | grep -q '"status":"AVAILABLE"' || { echo "ERROR: IT_SERVICES search status not AVAILABLE"; exit 1; }

          echo "Verifying mock-api is completely absent from public gateway (expecting 404)..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/mock-api/api/publish || true)
          if [ "$HTTP_CODE" != "404" ]; then
            echo "ERROR: /mock-api/api/publish returned HTTP $HTTP_CODE instead of 404!"
            exit 1
          fi

          echo "Verifying Mock Studio routing via Unified Gateway..."
          curl -f http://127.0.0.1:3000/mock-studio/ || exit 1
          MOCK_STATUS=$(curl -sf http://127.0.0.1:3000/mock-studio/api/status || exit 1)
          echo "Mock Studio status: $MOCK_STATUS"
          echo "$MOCK_STATUS" | grep -q '"ok":true' || { echo "ERROR: Mock Studio status not ok"; exit 1; }

          echo "✓ Unified Gateway on port 3000 is running securely with Explain API, Mock Studio, and pure Kafka topology pipeline!"
