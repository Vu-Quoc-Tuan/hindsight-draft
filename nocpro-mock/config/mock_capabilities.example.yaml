config_version: mock-v1

real_sources:
  alarm_csv:
    enabled: true
  topo_ip:
    enabled: true
    capabilities:
      adjacency: true
      freshness: true
      directed_dependency: false
      active_path: false
      failure_domain: false
  topo_it:
    enabled: false
    reason: "archive schema not yet verified"

synthetic_generators:
  dependency_hierarchy:
    enabled: true
  active_path:
    enabled: true
  failure_domain:
    enabled: true
  operational_context:
    enabled: true
  history:
    enabled: true
  evolution:
    enabled: true
  system_pair_metadata:
    enabled: true

policy:
  mutate_golden_fixture_in_place: false
  allow_fuzzy_topology_mapping: false
  synthetic_can_validate: false
  missing_pair_metadata_defaults_to: UNKNOWN
