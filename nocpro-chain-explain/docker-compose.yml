services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: nocpro
      POSTGRES_USER: nocpro
      POSTGRES_PASSWORD: nocpro
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocpro -d nocpro"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    ports: ["${KAFKA_HOST_PORT:-9092}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MESSAGE_MAX_BYTES: 8388608
      KAFKA_REPLICA_FETCH_MAX_BYTES: 8388608
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic nocpro.snapshot.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic nocpro.snapshot.v1.dlq --partitions 3 --replication-factor 1

  migrate:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://nocpro:nocpro@postgres:5432/nocpro
    command: [".venv/bin/alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports: ["${API_HOST_PORT:-8000}:8000"]
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql+asyncpg://nocpro:nocpro@postgres:5432/nocpro
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_SNAPSHOT_TOPIC: nocpro.snapshot.v1
      KAFKA_DLQ_TOPIC: nocpro.snapshot.v1.dlq
      KAFKA_MAX_CHUNKS: "1024"
      KAFKA_MAX_CHUNK_BYTES: "4194304"
      KAFKA_MAX_UNCOMPRESSED_BYTES: "268435456"
      KAFKA_MAX_COMPRESSED_BYTES: "268435456"
      KAFKA_RECEIVING_TTL_SECONDS: "86400"
      TIER1A_RECOVERY_INTERVAL_SECONDS: "${TIER1A_RECOVERY_INTERVAL_SECONDS:-2}"
      TIER1A_MAX_ATTEMPTS: "5"
      TIER1A_BACKOFF_BASE_SECONDS: "2"
      ANALYSIS_CONFIG_PATH: "${ANALYSIS_CONFIG_PATH:-/app/config/thresholds/v1.yaml}"
      AI_BASE_URL: "${AI_BASE_URL:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  web:
    build:
      context: services/web
      args:
        # Vite embeds this browser-facing URL at build time. It points only to
        # nocpro-mock's read-only topology/navigation API, never Explain/P2.
        VITE_NOCPRO_MOCK_URL: ${VITE_NOCPRO_MOCK_URL:-http://localhost:8085}
    ports: ["${WEB_HOST_PORT:-3000}:80"]
    depends_on: [api]

  mock-producer:
    profiles: ["replay"]
    build:
      context: ..
      dockerfile: nocpro-mock/Dockerfile
    working_dir: /workspace/nocpro-mock
    volumes:
      - ../nocpro-mock/datasets/raw:/workspace/nocpro-mock/datasets/raw:ro
    command:
      - .venv/bin/python
      - -m
      - nocpro_mock.cli
      - replay
      - --alarm-csv
      - datasets/raw/alarm/alarm_data.csv
      - --snapshot-id
      - ${MOCK_SNAPSHOT_ID:-docker-replay-001}
      - --snapshot-version
      - ${MOCK_SNAPSHOT_VERSION:-1}
      - --kafka-bootstrap
      - kafka:19092
      - --chunk-target-bytes
      - "2097152"
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # A bounded real-IP replay used only to prove exact identity mapping plus
  # undirected adjacency. It must not promote topology to directed P2/RCA.
  mock-producer-ip:
    profiles: ["replay-ip"]
    build:
      context: ..
      dockerfile: nocpro-mock/Dockerfile
    working_dir: /workspace/nocpro-mock
    volumes:
      - ../nocpro-mock/datasets/raw:/workspace/nocpro-mock/datasets/raw:ro
    command:
      - .venv/bin/python
      - -m
      - nocpro_mock.cli
      - replay
      - --alarm-csv
      - datasets/raw/alarm/alarmIP.csv
      - --topo-ip
      - datasets/raw/topo/topoIP.csv
      - --with-topology
      - --chain-id
      - "6912465"
      - --snapshot-id
      - ${MOCK_IP_SNAPSHOT_ID:-docker-ip-topology-001}
      - --snapshot-version
      - ${MOCK_IP_SNAPSHOT_VERSION:-1}
      - --kafka-bootstrap
      - kafka:19092
      - --chunk-target-bytes
      - "2097152"
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  mock-ui:
    build:
      context: ..
      dockerfile: nocpro-mock/Dockerfile
    working_dir: /workspace/nocpro-mock
    ports: ["${MOCK_UI_HOST_PORT:-8085}:8085"]
    volumes:
      - ../nocpro-mock/datasets/raw:/workspace/nocpro-mock/datasets/raw:ro
      # Synthetic scenarios are test fixtures. They are mounted read-only for
      # explicit local acceptance/replay and are never production source data.
      - ../nocpro-mock/docs/examples/synthetic:/workspace/nocpro-mock/docs/examples/synthetic:ro
    command:
      - .venv/bin/python
      - -m
      - nocpro_mock.cli
      - ui
      - --host
      - "0.0.0.0"
      - --port
      - "8085"
      - --kafka-bootstrap
      - kafka:19092
    depends_on:
      kafka-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
