schema_version: audit-scope-policy-v1
policy_id: audit-exact-scope-v1
policy_version: "1"
description: >-
  Conservative scope rules for the exact chain evaluator used by Structural
  Audit. Every distinct pair in the declared chain is applicable unless a
  future version adds an explicit, pre-registered rule proving otherwise.
approval_status: UNAPPROVED_DIAGNOSTIC_POLICY
scope_rules:
  - rule_id: alarm_pair_in_declared_diagnostic_population
    rule_version: "1"
    predicate: every_distinct_pair
    source: chain_member_universe
    description: Every distinct unordered pair in the frozen chain is in scope.
channels:
  - channel_id: E_reference
    execution_binding: exact_chain_evaluator
    scope_rule_id: alarm_pair_in_declared_diagnostic_population
    required_scope_metadata: []
    not_applicable_rule_ids: []
    missing_input_policy: applicable_unavailable
  - channel_id: E_device
    execution_binding: exact_chain_evaluator
    scope_rule_id: alarm_pair_in_declared_diagnostic_population
    required_scope_metadata: []
    not_applicable_rule_ids: []
    missing_input_policy: applicable_unavailable
