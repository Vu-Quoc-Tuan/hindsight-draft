capability_catalog:
  H:
    status: EXCLUDED_BY_EXECUTION_PROFILE
    reason: H is behavior-only PairWHY evidence and does not enter the exact Audit evaluator.
  H_domain:
    status: CANDIDATE_HYPEREDGE_ONLY
    reason: Failure-domain evidence proposes candidate blocks; it is not pairwise clique evidence.
  Dep_embed:
    status: NOT_IN_DEFAULT_AUDIT_EXECUTION_PROFILE
    reason: The canonical exact Tier-2 Audit path does not invoke the topology embedding evaluator.
