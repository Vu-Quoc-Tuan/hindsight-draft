policy_version: "review-reasons-v1"
description: "Reason codes for counterfactual candidate human review decisions"
reasons_by_decision:
  APPROVE:
    - code: "PLAUSIBLE_SUBGRAPH"
      label: "Plausible Subgraph"
      description: "Candidate reflects plausible network failure subgraph"
    - code: "CLEAN_FAULT_SEPARATION"
      label: "Clean Fault Separation"
      description: "Separates independent fault domains cleanly"
    - code: "DOMINATED_ROOT_CONFIRMED"
      label: "Dominated Root Confirmed"
      description: "Confirmed removal of ungrounded root alarm"
    - code: "EXPECTED_TOPOLOGY_BOUNDARY"
      label: "Expected Topology Boundary"
      description: "Matches physical or logical topology boundaries"
    - code: "VERIFIED_OPERATIONAL_IMPACT"
      label: "Verified Operational Impact"
      description: "Observed telemetry matches expected operational impact"

  REJECT:
    - code: "INCORRECT_PARTITION"
      label: "Incorrect Partition"
      description: "Splits alarms that belong to the same physical or logical root"
    - code: "UNRESOLVED_DEPENDENCY"
      label: "Unresolved Dependency"
      description: "Candidate violates known dependency direction"
    - code: "COINCIDENT_ALARMS_UNLINKED"
      label: "Coincident Alarms Unlinked"
      description: "Fails to group tightly coupled coincident alarms"
    - code: "CRITICAL_SERVICE_MISMATCH"
      label: "Critical Service Mismatch"
      description: "Isolates critical service alarm from transport path"
    - code: "INVALID_ROOT_CAUSE"
      label: "Invalid Root Cause"
      description: "Incorrect primary root candidate"

  DEFER:
    - code: "AWAITING_FIELD_CONFIRMATION"
      label: "Awaiting Field Confirmation"
      description: "Awaiting confirmation from field NOC technician"
    - code: "PENDING_MAINTENANCE_WINDOW"
      label: "Pending Maintenance Window"
      description: "Investigation pending scheduled maintenance"
    - code: "ESCALATED_TO_TIER3"
      label: "Escalated to Tier 3"
      description: "Requires advanced transmission / IP engineering review"

  INSUFFICIENT_EVIDENCE:
    - code: "MISSING_TOPOLOGY_DATA"
      label: "Missing Topology Data"
      description: "No adjacency or dependency data available for affected nodes"
    - code: "UNOBSERVED_DELAY_PROFILE"
      label: "Unobserved Delay Profile"
      description: "Temporal delay model has no historical coverage for this pair"
    - code: "SPARSE_HISTORICAL_TELEMETRY"
      label: "Sparse Historical Telemetry"
      description: "Insufficient alarm frequency to determine causality"

  NONE_ACCEPTABLE:
    - code: "ALL_CANDIDATES_DEGRADE_ACCURACY"
      label: "All Candidates Degrade Accuracy"
      description: "None of the generated candidate alternatives are acceptable"
    - code: "INCOMPLETE_CANDIDATE_SEARCH"
      label: "Incomplete Candidate Search"
      description: "The intended correct partition was not among the generated candidates"
    - code: "UNSUPPORTED_FAULT_TOPOLOGY"
      label: "Unsupported Fault Topology"
      description: "Chain pattern requires candidate operations not supported by current generator"

  MANUAL_CORRECTION:
    - code: "MANUAL_TOPOLOGY_SPLIT"
      label: "Manual Topology Split"
      description: "Candidate adjusted by reviewer splitting specific device sets"
    - code: "MANUAL_CORE_REASSIGNMENT"
      label: "Manual Core Reassignment"
      description: "Candidate adjusted by reviewer reassigning core/boundary alarm roles"
    - code: "MANUAL_DOMAIN_PARTITION"
      label: "Manual Domain Partition"
      description: "Candidate adjusted by reviewer isolating optical and IP failure domains"
