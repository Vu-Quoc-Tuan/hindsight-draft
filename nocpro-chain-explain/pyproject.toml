[project]
name = "nocpro-chain-explain"
version = "0.1.0"
description = "Interactive explanation and audit API for NocPro alarm chains"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiokafka==0.14.0",
  "alembic==1.19.1",
  "asyncpg==0.31.0",
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "PyYAML==6.0.2",
  "SQLAlchemy==2.0.52",
  "uvicorn==0.52.4",
  "zstandard==0.25.0",
]

[dependency-groups]
dev = [
  "httpx2==2.12.0",
  "pytest==8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "realdata: requires the real exports in nocpro-mock/datasets/raw",
  "postgres: requires a migrated PostgreSQL test database",
]
